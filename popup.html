<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stillglass</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="kicker">Loupe</p>
      <h1>Stillglass</h1>
    </header>
    <button type="button" id="loupe">Loupe the picture under your pointer</button>
    <button type="button" id="frame">Grab a video frame</button>
    <button type="button" id="page">Capture the visible page</button>
    <label class="hover">
      <input type="checkbox" id="hover" checked />
      Show the hover chip
    </label>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
